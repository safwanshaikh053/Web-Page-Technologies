<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* element name selector */
        h3{
            color: aquamarine;
            background-color: blue;
        }
        h2{
            color: rgb(236, 123, 123);
            background-color: chocolate;
        }
        /* group selector  */
        b,strong,em{
            color: darkred;
            font-size: 20px;
        }
        /* id selector  */
        #d4{
            color: tomato;
            font-size: 35px;
            text-align: center;
        }
        /* class selector  */
        .cls1{
            color: blue;
            text-decoration: underline;
            text-align: right;
        }
        /* universal selector  */
        *{
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }
    </style>
</head>
<body>
    <h3>Pune</h3>
    <br>
    <h2>Mumbai</h2>
    <br>
    <b>Safwan</b>
    <br>
    <strong>Junaid</strong>
    <br>
    <em>Arsalan</em>
    <br>
    <div class="cls1">this is div1 </div>
    <div class="cls1">this is div2</div>
    <div class="cls1">this is div3 </div>
    <div id="d4">this is div4 </div>
    <div>this is div5 </div>
    <div>this is div6 </div>

</body>
</html>
