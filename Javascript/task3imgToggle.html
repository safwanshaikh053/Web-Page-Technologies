<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
</head>
<body>
   
    <br><hr>

    <img id="togglingImg" src="../HTML/assets/hulk.jpg" alt="image" height="350px" width="500px" style="margin: 20px; border-radius: 2%;">
    <h3 id="imgname">HULK</h3>
    <button id="imgtoggler" type="button" onclick="toggleImage()">Toggle image</button>
    <br><hr>

   
    <script>
        let btnclick = true;
        function toggleImage(){
            if (btnclick) {
                document.getElementById("togglingImg").src = "../HTML/assets/ironman3.jpg";
                document.getElementById("imgname").innerHTML = "IRON MAN";
                btnclick = false;
            } else {
                document.getElementById("togglingImg").src = "../HTML/assets/hulk.jpg";
                document.getElementById("imgname").innerHTML = "HULK";
                btnclick = true;
            }
        }
    </script>
</body>
</html>
