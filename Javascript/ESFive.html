<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //   trim(): it remove unwanted white spaces from both side of string , it works with string data .

      //forEach(): it call another once for each array. it do not return any values, it is use to iterate array value only
      let friends = ["Junaid", "Aabhas", "Shubham", "Aasif", "Vaibhav"];
      friends.forEach((val, index) => {
        document.write(val + ",");
      });
      document.write("<br>");
      let num = [
        1, 2, 5, 7, 9, 10, 11, 13, 15, 18, 20, 21, 22, 24, 25, 27, 28, 30,
      ];
      document.write(num,"<br>");
      //   map():it call another once for each array element, and it return new array after performing manupulation with existing array.
    let mulOut = num.map((val,index)=>{
        return val*2;
     });
      document.write(mulOut,"<br>");
      // filter():it call another once for each array and return new array of those who satisfy given condition.
      let filterOut = num.filter((val,index)=>{
          return val%2!=0;
      });
      document.write(filterOut,"<br>");
      //every():it call another once for each array and return true value if all array element satisfy given condition.
      let everyOut = num.every((val,index)=>{
        return val > 0;
      });
      document.write(everyOut,"<br>");
      //some():it call another once for each array and return true value if some array element satisfy given condition.
      let someOut= num.some((val,index)=>{
        return val > 10;
      });
      document.write(someOut,"<br>");

      //reduce/reduceRight(): it return array values as single result,it takes two parameter,prevNum,nextNum
      let reduceOut = num.reduce((prev,next)=>{
        return prev+next;
      });
      document.write(reduceOut,"<br>");

    </script>
  </body>
</html>
