<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .myform {
            border: 3px solid rgb(5, 5, 77);
            width: 300px;
            height: 170px;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin: auto;
            box-shadow: 7px 6px 8px black;
            background-color: brown;
        }

        .myform input {
            display: block;
            width: 200px;
            height: 25px;
            font-size: 20px;
            margin: 5px;
            background-color: burlywood;
        }
    </style>
</head>

<body>
    <form class="myform">
        <input type="text" name="num1" id="num1" placeholder="Enter 1st Number ">
        <input type="text" name="num2" id="num2" placeholder="Enter 2nd Number ">
        <button type="button" onclick="add()">Add</button>
        <button type="button" onclick="sub()">Sub</button>
        <button type="button" onclick="mul()">Mul</button>
        <button type="button" onclick="div()">Div</button>
        <h2 id="d1">Result:</h2>

    </form>
    <script>
        function add() {
            let no1 = document.getElementById("num1").value;
            let no2 = document.getElementById("num2").value;

            document.getElementById("d1").innerHTML = (parseInt(no1) + parseInt(no2));
        }


        function sub() {
            let no1 = document.getElementById("num1").value;
            let no2 = document.getElementById("num2").value;

            document.getElementById("d1").innerHTML = (parseInt(no1) - parseInt(no2));
        }

        function mul() {
            let no1 = document.getElementById("num1").value;
            let no2 = document.getElementById("num2").value;

            document.getElementById("d1").innerHTML = (parseInt(no1) * parseInt(no2));
        }

        function div() {
            let no1 = document.getElementById("num1").value;
            let no2 = document.getElementById("num2").value;

            document.getElementById("d1").innerHTML = (parseInt(no1) / parseInt(no2));

        }

    </script>
</body>

</html>
