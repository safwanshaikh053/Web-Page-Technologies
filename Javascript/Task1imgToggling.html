<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container{
            border: 2px solid black;
            background-color: rgb(143, 228, 165);
            height: 350px;
            width: 400px;
            
            text-align: center; 
            

        }
    </style>
    <title>Document</title>
</head>
<body>
    
<div class="container">
<table border="2px solid roound" width="20%">
        <tr>
            <td id="t1">1</td>
            <td id="t2">2</td>
            <td id="t3">3</td>
        </tr>
        <tr>
            <td id="t4">4</td>
            <td id="t5">5</td>
            <td id="t6">6</td>
        </tr>
        <tr>
            <td id="t7">7</td>
            <td id="t8">8</td>
            <td id="t9">9</td>
        </tr>
    </table>
    <input id="num" type="text" placeholder="enter number" min="1" max="9">
    <input id="clr" type="color" placeholder="enter colour red, blue, green, yellow">
    <button type="button" onclick="changeColor()">Set colour</button>
    </div>
    <br>
    <hr>

    <script>
        function changeColor(){
            let selectedid = document.getElementById("num").value;
            let selectedcolor = document.getElementById("clr").value;
            console.log(selectedcolor);
            document.getElementById(`t${selectedid}`).style.backgroundColor = selectedcolor;
        }
    </script>
</body>
</html>
